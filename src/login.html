<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkPay | Iniciar sesion</title>
    <link rel="stylesheet" href="../css/output.css">
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-950 via-blue-800 to-indigo-900">

    <main class="flex min-h-screen items-center justify-center px-6">
        <div class="w-full max-w-md rounded-2xl bg-white p-8 shadow-2xl">
            <h1 class="text-center text-2xl font-bold text-gray-800">Iniciar sesion</h1>

            <form id="loginForm" class="mt-8 space-y-5">
                <div>
                    <label for="email" class="mb-1 block text-sm font-semibold text-gray-700">Correo electronico</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="tucorreo@ejemplo.com"
                        required
                        class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm text-gray-800 placeholder-gray-400 transition focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
                    >
                </div>

                <div>
                    <label for="password" class="mb-1 block text-sm font-semibold text-gray-700">Contrasena</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Tu contrasena"
                        required
                        class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm text-gray-800 placeholder-gray-400 transition focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
                    >
                </div>

                <button
                    type="submit"
                    id="btnEnviar"
                    class="w-full rounded-lg bg-gradient-to-r from-blue-500 to-indigo-500 py-3 font-semibold text-white shadow-lg transition hover:from-blue-600 hover:to-indigo-600 focus:outline-none focus:ring-2 focus:ring-blue-300"
                >
                    Entrar
                </button>
            </form>
        </div>
    </main>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function (event) {
            event.preventDefault();
        });
    </script>
</body>
</html>
